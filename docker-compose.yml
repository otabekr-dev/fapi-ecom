name: fapi-ecom
services:
  web:
    build: .
    ports:
      - '8000:8000'
    volumes:
      - .:/app
      - /app/.venv
    command: uv run uvicorn apps.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      - db
  
  db:
    image: postgres:16
    ports:
      - '5432:5432'
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: